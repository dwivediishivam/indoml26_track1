# M2: BEATs strong + mel CNN fusion, with validation natural clips (folds 0-3); fold 4 held out.
name: m2_beats
seed: 23
backbone:
  name: fusion
  proj_dim: 512
  part_dropout: 0.1
  parts:
    - name: beats_strong
      checkpoint: ~/indoml-offline/model/BEATs_strong_1.pt
    - name: mel_cnn
model:
  hidden: 256
data:
  val_holdout_folds: [4]
sources:
  gold: 0.35
  silver: 0.25
  bronze: 0.05
  synthetic: 0.25
  val_natural: 0.10
synthetic:
  factory: models.data:build_synthgen
  kwargs:
    exclude_folds: [4]
    size: 1000000
    seed: 23
    max_seconds: 10.0
    mixer: {widen_prob: 0.25, sources: {noise: {gold: {weight: 0.6}}, speech: {gold_speech: {weight: 0.5}}}}   # bank + Gold events, widened for natural robustness
optim:
  batch_size: 16
  head_lr: 1.0e-3
  encoder_lr: 1.0e-5
  layer_decay: 0.85
  freeze_steps: 1500
  max_steps: 40000
monitor:
  folds: [4]
