# M7 (Colab A100 40GB): ATST-F strong + mel CNN, NO validation audio (clean: tunable on full validation),
# seed 77, 6 s crops, bank + Gold-event widened synthetic mixtures.
name: m7_atst_s77
seed: 77
backbone:
  name: fusion
  proj_dim: 512
  part_dropout: 0.1
  parts:
    - name: atst_strong
      checkpoint: /content/weights/ATST-F_strong_1.pt
    - name: mel_cnn
model:
  hidden: 256
sources:
  gold: 0.40
  silver: 0.27
  bronze: 0.05
  synthetic: 0.28
  val_natural: 0.0
synthetic:
  factory: models.data:build_synthgen
  kwargs:
    exclude_folds: [4]
    size: 1000000
    seed: 77
    max_seconds: 10.0
    mixer: {widen_prob: 0.25, sources: {noise: {gold: {weight: 0.6, data_dir: "/content/vaani_staged"}}, speech: {gold_speech: {weight: 0.5, data_dir: "/content/vaani_staged"}}}}
data:
  crop_seconds: 6.0
optim:
  batch_size: 24
  head_lr: 1.0e-3
  encoder_lr: 1.0e-5
  layer_decay: 0.85
  freeze_steps: 1000
  max_steps: 40000
monitor:
  folds: [4]
