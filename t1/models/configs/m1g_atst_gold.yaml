# M1g: continue the best m1_atst checkpoint on Gold-convention data only (Gold + val natural folds 0-3 + exact
# synthetic), no Silver/Bronze. Targets the over-long natural predictions learned from Silver's looser boundaries.
# Launch with TRAIN_EXTRA="--init-from <m1_atst ema checkpoint>".
name: m1g_atst_gold
seed: 23
backbone:
  name: fusion
  proj_dim: 512
  part_dropout: 0.1
  parts:
    - name: atst_strong
      checkpoint: ~/indoml-offline/model/ATST-F_strong_1.pt
    - name: mel_cnn
model:
  hidden: 256
sources:
  gold: 0.60
  silver: 0.0
  bronze: 0.0
  synthetic: 0.25
  val_natural: 0.15
synthetic:
  factory: models.data:build_synthgen
  kwargs:
    exclude_folds: [4]
    size: 1000000
    seed: 23
    max_seconds: 10.0
    mixer: {}
optim:
  batch_size: 16
  head_lr: 3.0e-4
  encoder_lr: 5.0e-6
  layer_decay: 0.85
  freeze_steps: 0
  max_steps: 12000
monitor:
  folds: [4]
data:
  val_holdout_folds: [4]
