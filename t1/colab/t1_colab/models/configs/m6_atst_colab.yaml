# M6 (Colab A100): ATST-F strong + mel CNN, val natural folds 0-3, seed 91, bank + Gold-event widened synthetic mixtures.
# Every key not listed here takes its default from models/config.py (DEFAULTS); unknown keys are errors.
# Paths are placeholders under ~/indoml-offline/model; override with --set, e.g.
#   --set backbone.parts.0.checkpoint=/path/ATST-F_strong_1.pt
name: m6_atst_colab
seed: 91
backbone:
  name: fusion
  proj_dim: 512
  part_dropout: 0.1
  parts:
    - name: atst_strong
      checkpoint: /content/weights/ATST-F_strong_1.pt
    - name: mel_cnn
model:
  hidden: 256
sources:
  gold: 0.35
  silver: 0.25
  bronze: 0.05
  synthetic: 0.25
  val_natural: 0.10
synthetic:
  factory: models.data:build_synthgen
  kwargs:
    exclude_folds: [4]          # must contain every monitor fold
    size: 1000000
    seed: 91
    max_seconds: 10.0
    mixer: {widen_prob: 0.25, sources: {noise: {gold: {weight: 0.6, data_dir: "/content/vaani_staged"}}, speech: {gold_speech: {weight: 0.5, data_dir: "/content/vaani_staged"}}}}
optim:
  batch_size: 16
  head_lr: 1.0e-3
  encoder_lr: 1.0e-5
  layer_decay: 0.85
  freeze_steps: 1200
  max_steps: 40000
monitor:
  folds: [4]
data:
  val_holdout_folds: [4]
